<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Nathan Elliott</title>
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <header>
            <h1>Tags I've Learned</h1>
        </header>
        <main>
            <a href="index.html" class="nav-bar">Index</a>
            <dl>
                <dt>&lt;q&gt;</dt>
                <dd>Adds a quotation section that is smaller than the rest of the text.</dd>

                <dt>&lt;mark&gt;</dt>
                <dd>Highlights whatever text is in it.</dd>

                <dt>&lt;h1&gt;</dt>
                <dd>The largest form of headings. Useful for the top of the page.</dd>

                <dt>&lt;p&gt;</dt>
                <dd>Good for large paragraphs.</dd>

                <dt>&lt;dl&gt;</dt>
                <dd>Creates detailed lists with descriptions.</dd>
            </dl>
        </main>
    </body>
</html>
